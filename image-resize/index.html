<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>이미지 크기 변경 | JPG PNG WebP 리사이즈</title><meta name="description" content="JPG PNG WebP 이미지를 서버 업로드 없이 브라우저에서 크기 변경하고 여러 이미지를 일괄 다운로드하세요."><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#f5f7fb;color:#111827}.page{max-width:900px;margin:auto;padding:55px 20px 80px}.badge{display:inline-block;padding:7px 11px;border-radius:8px;background:#edf1ff;color:#465ee8;font-size:12px;font-weight:800;letter-spacing:1px}h1{margin:15px 0 7px;font-size:34px}.subtitle{color:#687386;line-height:1.7}.card{margin-top:24px;padding:28px;border:1px solid #e3e7ef;border-radius:18px;background:#fff}.drop{border:2px dashed #abb7d5;border-radius:16px;padding:42px 20px;text-align:center;cursor:pointer}.drop:hover,.drop.drag{background:#f6f8ff}.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer;background:#4e5ee8;color:#fff}.privacy{margin-top:17px;padding:14px 16px;border-radius:11px;background:#effaf3;color:#376e4d;font-size:13px}.panel{display:none;margin-top:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:16px;background:#f8f9fd;border-radius:12px}.controls label{font-size:13px;color:#687386}.controls input,.controls select{display:block;margin-top:5px;width:130px;padding:10px;border:1px solid #d9deea;border-radius:8px;background:#fff}.check{display:flex;align-items:center;gap:6px;padding-bottom:9px}.check input{width:auto;margin:0}.list{display:grid;gap:9px;margin-top:15px}.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid #e5e8f0;border-radius:11px}.thumb{width:60px;height:60px;object-fit:cover;border-radius:7px}.name{font-weight:700;word-break:break-all}.small{font-size:12px;color:#8993a6;margin-top:4px}.mini{border:1px solid #dce1ed;background:white;border-radius:7px;padding:8px;cursor:pointer}.make{width:100%;margin-top:17px}.result,.error{display:none;margin-top:15px;padding:14px;border-radius:10px}.result{background:#f2f5ff;text-align:center}.error{background:#fff0f0;color:#b23a3a}@media(max-width:600px){.page{padding-top:30px}h1{font-size:27px}.card{padding:18px}.item{grid-template-columns:50px 1fr}.thumb{width:50px;height:50px}.item .mini{grid-column:1/-1}}</style></head><body><div class="page"><span class="badge">FREE WORK TOOLS</span><h1>이미지 크기 변경</h1><p class="subtitle">JPG · PNG · WebP 이미지의 가로·세로 크기를 변경하세요.<br>여러 이미지도 한 번에 처리하며 파일은 서버로 전송하지 않습니다.</p><div class="card"><div id="drop" class="drop"><strong>이미지를 여기에 드래그하세요</strong><p>여러 장을 한 번에 선택할 수 있습니다.</p><button id="pick" class="btn">이미지 선택</button><input id="input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div class="privacy">🔒 선택한 이미지는 별도 서버에 업로드하지 않습니다. 크기 변경은 현재 브라우저에서 수행됩니다.</div><div id="panel" class="panel"><div class="controls"><label>변경 방식<select id="mode"><option value="width">가로폭 기준</option><option value="height">세로높이 기준</option><option value="both">가로 × 세로 직접 지정</option><option value="percent">비율(%)</option></select></label><label id="wbox">가로(px)<input id="width" type="number" min="1" value="1200"></label><label id="hbox" style="display:none">세로(px)<input id="height" type="number" min="1" value="800"></label><label id="pbox" style="display:none">비율(%)<input id="percent" type="number" min="1" max="500" value="50"></label><label class="check" id="keepbox"><input id="keep" type="checkbox" checked> 원본 비율 유지</label><label>출력 형식<select id="format"><option value="original">원본 형식</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label></div><div id="list" class="list"></div><button id="make" class="btn make">크기 변경 후 다운로드</button></div><div id="error" class="error"></div><div id="result" class="result">✓ 이미지 크기 변경이 완료되었습니다.</div></div></div><script>const input=document.getElementById('input'),pick=document.getElementById('pick'),drop=document.getElementById('drop'),panel=document.getElementById('panel'),list=document.getElementById('list'),mode=document.getElementById('mode'),W=document.getElementById('width'),H=document.getElementById('height'),P=document.getElementById('percent'),keep=document.getElementById('keep'),format=document.getElementById('format'),make=document.getElementById('make'),errorBox=document.getElementById('error'),result=document.getElementById('result'),wbox=document.getElementById('wbox'),hbox=document.getElementById('hbox'),pbox=document.getElementById('pbox'),keepbox=document.getElementById('keepbox');let items=[];pick.onclick=e=>{e.stopPropagation();input.click()};drop.onclick=()=>input.click();input.onchange=()=>{addFiles([...input.files]);input.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');addFiles([...e.dataTransfer.files])};async function addFiles(files){hideError();for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type))continue;try{const b=await createImageBitmap(f);items.push({file:f,url:URL.createObjectURL(f),w:b.width,h:b.height});b.close?.()}catch(e){}}render()}function render(){panel.style.display=items.length?'block':'none';result.style.display='none';list.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<img class="thumb" src="${it.url}"><div><div class="name"></div><div class="small">${it.w} × ${it.h}px · ${fmt(it.file.size)}</div></div><button class="mini">삭제</button>`;d.querySelector('.name').textContent=it.file.name;d.querySelector('.mini').onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);render()};list.appendChild(d)})}mode.onchange=()=>{wbox.style.display=['width','both'].includes(mode.value)?'block':'none';hbox.style.display=['height','both'].includes(mode.value)?'block':'none';pbox.style.display=mode.value==='percent'?'block':'none';keepbox.style.display=mode.value==='both'?'flex':'none'};mode.onchange();function dims(it){let w=it.w,h=it.h;if(mode.value==='width'){w=Math.max(1,+W.value||1);h=Math.max(1,Math.round(it.h*w/it.w))}else if(mode.value==='height'){h=Math.max(1,+H.value||1);w=Math.max(1,Math.round(it.w*h/it.h))}else if(mode.value==='percent'){const p=Math.max(1,+P.value||1)/100;w=Math.max(1,Math.round(it.w*p));h=Math.max(1,Math.round(it.h*p))}else{w=Math.max(1,+W.value||1);h=Math.max(1,+H.value||1);if(keep.checked){const s=Math.min(w/it.w,h/it.h);w=Math.max(1,Math.round(it.w*s));h=Math.max(1,Math.round(it.h*s))}}return[w,h]}async function resize(it){const bmp=await createImageBitmap(it.file),[w,h]=dims(it),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,w,h);bmp.close?.();let type=format.value==='original'?it.file.type:format.value;if(type==='image/jpeg'){const bg=document.createElement('canvas');bg.width=w;bg.height=h;const bx=bg.getContext('2d');bx.fillStyle='#fff';bx.fillRect(0,0,w,h);bx.drawImage(c,0,0);return await new Promise(r=>bg.toBlob(r,type,.9))}return await new Promise(r=>c.toBlob(r,type,type==='image/webp'?.9:undefined))}make.onclick=async()=>{if(!items.length)return;hideError();result.style.display='none';make.disabled=true;make.textContent='처리 중...';try{for(let i=0;i<items.length;i++){const it=items[i],blob=await resize(it);if(!blob)throw new Error();const ext=blob.type==='image/jpeg'?'jpg':blob.type==='image/png'?'png':'webp',base=it.file.name.replace(/\.[^.]+$/,'');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=base+'_resized.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);if(items.length>1)await new Promise(r=>setTimeout(r,250))}result.style.display='block'}catch(e){showError('이미지 처리 중 오류가 발생했습니다. 너무 큰 이미지는 한 번에 적은 수로 시도해 주세요.')}finally{make.disabled=false;make.textContent='크기 변경 후 다운로드'}};function fmt(n){const u=['B','KB','MB','GB'],i=n?Math.min(Math.floor(Math.log(n)/Math.log(1024)),3):0;return(n/1024**i).toFixed(i?2:0)+' '+u[i]}function showError(t){errorBox.textContent=t;errorBox.style.display='block'}function hideError(){errorBox.style.display='none'}</script></body></html>
