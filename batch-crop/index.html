<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여러 이미지 같은 영역 일괄 자르기</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif}.p{max-width:1000px;margin:auto;padding:48px 20px 80px}.badge{display:inline-block;padding:7px 11px;background:#edf1ff;color:#465ee8;border-radius:8px;font-size:12px;font-weight:800}h1{font-size:34px;margin:14px 0 7px}.sub{color:#687386;line-height:1.7}.card{margin-top:24px;background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:25px}.drop{padding:35px 20px;border:2px dashed #abb7d5;border-radius:14px;text-align:center;cursor:pointer}.drop.drag{background:#f6f8ff}.btn{border:0;border-radius:9px;padding:12px 17px;background:#4e5ee8;color:#fff;font-weight:700;cursor:pointer}.pick{margin-top:14px}.privacy{margin-top:15px;padding:14px;background:#effaf3;color:#376e4d;border-radius:10px;font-size:13px}.work{display:none;margin-top:20px}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:13px;background:#f8f9fd;border-radius:10px;align-items:end}.tools label{font-size:12px;color:#687386}.tools select,.tools input{display:block;margin-top:4px;padding:9px;border:1px solid #d9deea;border-radius:7px;background:#fff;width:105px}.stage{margin-top:14px;background:#e9edf4;border-radius:10px;overflow:auto;text-align:center;padding:10px}.stage canvas{max-width:100%;height:auto;display:block;margin:auto;cursor:crosshair;touch-action:none}.hint{text-align:center;color:#687386;font-size:13px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:15px}.item{padding:8px;border:1px solid #e1e5ee;border-radius:9px}.item img{width:100%;height:150px;object-fit:contain;background:#eef1f6}.item div{font-size:11px;color:#687386;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0}.item button{width:100%;border:0;padding:8px;border-radius:7px;background:#f0f2ff;color:#465ee8;font-weight:700;cursor:pointer}.status{margin:12px 0;font-size:13px;color:#4f5ee8;font-weight:700}.error{display:none;margin-top:14px;padding:13px;background:#fff0f0;color:#b23a3a;border-radius:9px}@media(max-width:600px){h1{font-size:27px}.card{padding:17px}}</style></head><body><main class="p"><span class="badge">FREE WORK TOOLS</span><h1>여러 이미지 같은 영역 일괄 자르기</h1><p class="sub">첫 이미지에서 한 번 영역을 지정하면 여러 사진의 같은 위치를 한꺼번에 잘라냅니다.</p><section class="card"><div id="drop" class="drop"><b>이미지 여러 장을 여기에 드래그하세요</b><br><button id="pick" class="btn pick">이미지 여러 장 선택</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div class="privacy">🔒 선택한 이미지는 서버에 업로드하지 않고 현재 브라우저에서 처리합니다.</div><div id="work" class="work"><div id="status" class="status"></div><div class="tools"><label>비율<select id="ratio"><option value="free">자유 선택</option><option value="1">1 : 1</option><option value="1.333333">4 : 3</option><option value="0.75">3 : 4</option><option value="1.777778">16 : 9</option></select></label><label>X (%)<input id="xp" type="number" min="0" max="99.9" step="0.1"></label><label>Y (%)<input id="yp" type="number" min="0" max="99.9" step="0.1"></label><label>폭 (%)<input id="wp" type="number" min="0.1" max="100" step="0.1"></label><label>높이 (%)<input id="hp" type="number" min="0.1" max="100" step="0.1"></label><label>저장<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><button id="run" class="btn">전체 이미지 자르기</button></div><p class="hint">첫 번째 이미지에서 마우스/손가락으로 자를 영역을 드래그하세요. 다른 이미지에는 같은 위치 비율로 적용됩니다.</p><div class="stage"><canvas id="canvas"></canvas></div><div id="results" class="results"></div></div><div id="error" class="error"></div></section></main><script>const $=id=>document.getElementById(id);const file=$('file'),drop=$('drop'),pick=$('pick'),work=$('work'),canvas=$('canvas'),ctx=canvas.getContext('2d'),ratio=$('ratio'),xp=$('xp'),yp=$('yp'),wp=$('wp'),hp=$('hp'),format=$('format'),results=$('results'),error=$('error'),status=$('status');let files=[],bitmaps=[],sel={x:.1,y:.1,w:.8,h:.8},dragging=false,start=null;pick.addEventListener('click',e=>{e.stopPropagation();file.click()});drop.addEventListener('click',()=>file.click());file.addEventListener('change',()=>{loadFiles(Array.from(file.files));file.value=''});drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');loadFiles(Array.from(e.dataTransfer.files))});[xp,yp,wp,hp].forEach(el=>el.addEventListener('change',readInputs));ratio.addEventListener('change',setRatio);async function loadFiles(fs){hideError();const valid=fs.filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));if(!valid.length){showError('JPG, PNG, WebP 이미지를 선택해 주세요.');return}try{bitmaps.forEach(b=>b.close&&b.close());bitmaps=[];files=valid;for(const f of files)bitmaps.push(await createImageBitmap(f));sel={x:.1,y:.1,w:.8,h:.8};work.style.display='block';status.textContent=`${files.length}개 이미지 선택됨 · 기준 이미지 ${bitmaps[0].width} × ${bitmaps[0].height}px`;results.innerHTML='';syncInputs();draw()}catch(e){console.error(e);showError('이미지를 불러오는 중 오류가 발생했습니다.')}}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function setRatio(){if(!bitmaps.length||ratio.value==='free')return;const b=bitmaps[0],r=Number(ratio.value);let w=.8,h=w*b.width/(r*b.height);if(h>.8){h=.8;w=h*r*b.height/b.width}sel={x:(1-w)/2,y:(1-h)/2,w,h};syncInputs();draw()}function draw(){if(!bitmaps.length)return;const b=bitmaps[0];canvas.width=b.width;canvas.height=b.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(b,0,0);ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,canvas.width,canvas.height);const r=rectPixels(b);ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();ctx.drawImage(b,0,0);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,b.width/600*2);ctx.strokeRect(r.x,r.y,r.w,r.h)}function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}}canvas.addEventListener('pointerdown',e=>{if(!bitmaps.length)return;e.preventDefault();dragging=true;start=pointerPos(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();updateSelection(pointerPos(e))});canvas.addEventListener('pointerup',e=>{if(!dragging)return;e.preventDefault();updateSelection(pointerPos(e));dragging=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointercancel',()=>dragging=false);function updateSelection(q){let x=Math.min(start.x,q.x),y=Math.min(start.y,q.y),w=Math.abs(q.x-start.x),h=Math.abs(q.y-start.y);if(ratio.value!=='free'){const b=bitmaps[0],r=Number(ratio.value);if(w*b.width/(h*b.height||1)>r)w=h*r*b.height/b.width;else h=w*b.width/(r*b.height);if(q.x<start.x)x=start.x-w;if(q.y<start.y)y=start.y-h}x=clamp(x,0,1);y=clamp(y,0,1);w=clamp(w,.001,1-x);h=clamp(h,.001,1-y);sel={x,y,w,h};syncInputs();draw()}function syncInputs(){xp.value=(sel.x*100).toFixed(1);yp.value=(sel.y*100).toFixed(1);wp.value=(sel.w*100).toFixed(1);hp.value=(sel.h*100).toFixed(1)}function readInputs(){let x=clamp((Number(xp.value)||0)/100,0,.999),y=clamp((Number(yp.value)||0)/100,0,.999),w=clamp((Number(wp.value)||.1)/100,.001,1-x),h=clamp((Number(hp.value)||.1)/100,.001,1-y);sel={x,y,w,h};syncInputs();draw()}function rectPixels(b){let x=Math.floor(sel.x*b.width),y=Math.floor(sel.y*b.height);x=clamp(x,0,b.width-1);y=clamp(y,0,b.height-1);let w=Math.max(1,Math.round(sel.w*b.width)),h=Math.max(1,Math.round(sel.h*b.height));w=Math.min(w,b.width-x);h=Math.min(h,b.height-y);return{x,y,w,h}}$('run').addEventListener('click',()=>{if(!bitmaps.length){showError('이미지를 먼저 선택해 주세요.');return}hideError();results.innerHTML='';bitmaps.forEach((b,i)=>cropOne(b,files[i],i));results.scrollIntoView({behavior:'smooth',block:'nearest'})});function cropOne(b,f,i){const r=rectPixels(b),c=document.createElement('canvas');c.width=r.w;c.height=r.h;const x=c.getContext('2d');if(format.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(b,r.x,r.y,r.w,r.h,0,0,r.w,r.h);c.toBlob(blob=>{if(!blob){showError('일부 이미지 저장에 실패했습니다.');return}const url=URL.createObjectURL(blob),d=document.createElement('div');d.className='item';const im=document.createElement('img'),txt=document.createElement('div'),btn=document.createElement('button');im.src=url;txt.textContent=`${f.name} · ${r.w}×${r.h}`;btn.textContent='다운로드';btn.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=f.name.replace(/\.[^.]+$/,'')+'_crop.'+ext();document.body.appendChild(a);a.click();a.remove()};d.append(im,txt,btn);results.appendChild(d)},format.value,.92)}function ext(){return format.value==='image/jpeg'?'jpg':format.value==='image/webp'?'webp':'png'}function showError(t){error.textContent=t;error.style.display='block'}function hideError(){error.style.display='none'}</script></body></html>
