<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여러 이미지 같은 영역 일괄 자르기</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif}.p{max-width:1000px;margin:auto;padding:48px 20px 80px}.badge{display:inline-block;padding:7px 11px;background:#edf1ff;color:#465ee8;border-radius:8px;font-size:12px;font-weight:800}h1{font-size:34px;margin:14px 0 7px}.sub{color:#687386;line-height:1.7}.card{margin-top:24px;background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:25px}.drop{padding:35px 20px;border:2px dashed #abb7d5;border-radius:14px;text-align:center;cursor:pointer}.drop.drag{background:#f6f8ff}.btn{border:0;border-radius:9px;padding:12px 17px;background:#4e5ee8;color:#fff;font-weight:700;cursor:pointer}.pick{margin-top:14px}.privacy{margin-top:15px;padding:14px;background:#effaf3;color:#376e4d;border-radius:10px;font-size:13px}.work{display:none;margin-top:20px}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:13px;background:#f8f9fd;border-radius:10px}.tools label{font-size:12px;color:#687386}.tools select,.tools input{display:block;margin-top:4px;padding:9px;border:1px solid #d9deea;border-radius:7px;background:#fff;width:105px}.stage{position:relative;margin-top:14px;background:#e9edf4;border-radius:10px;overflow:auto;text-align:center;padding:10px}.stage canvas{max-width:100%;height:auto;display:block;margin:auto;cursor:crosshair;touch-action:none}.hint{text-align:center;color:#687386;font-size:13px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:15px}.item{padding:8px;border:1px solid #e1e5ee;border-radius:9px}.item img{width:100%;height:150px;object-fit:contain;background:#eef1f6}.item div{font-size:11px;color:#687386;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0}.item button{width:100%;border:0;padding:8px;border-radius:7px;background:#f0f2ff;color:#465ee8;font-weight:700;cursor:pointer}.error{display:none;margin-top:14px;padding:13px;background:#fff0f0;color:#b23a3a;border-radius:9px}@media(max-width:600px){h1{font-size:27px}.card{padding:17px}}</style></head><body><main class="p"><span class="badge">FREE WORK TOOLS</span><h1>여러 이미지 같은 영역 일괄 자르기</h1><p class="sub">첫 이미지에서 한 번 영역을 지정하면 여러 사진의 같은 위치를 한꺼번에 잘라냅니다.</p><section class="card"><div id="drop" class="drop"><b>이미지 여러 장을 여기에 드래그하세요</b><br><button id="pick" class="btn pick">이미지 여러 장 선택</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div class="privacy">🔒 선택한 이미지는 서버에 업로드하지 않고 현재 브라우저에서 처리합니다.</div><div id="work" class="work"><div class="tools"><label>비율<select id="ratio"><option value="free">자유 선택</option><option value="1">1 : 1</option><option value="1.333333">4 : 3</option><option value="0.75">3 : 4</option><option value="1.777778">16 : 9</option></select></label><label>X (%)<input id="xp" type="number" min="0" max="100" step="0.1"></label><label>Y (%)<input id="yp" type="number" min="0" max="100" step="0.1"></label><label>폭 (%)<input id="wp" type="number" min="0.1" max="100" step="0.1"></label><label>높이 (%)<input id="hp" type="number" min="0.1" max="100" step="0.1"></label><label>저장<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><button id="run" class="btn">전체 이미지 자르기</button></div><p class="hint">첫 번째 이미지에서 자를 영역을 드래그하세요. 선택 위치는 모든 이미지에 비율 기준으로 동일 적용됩니다.</p><div class="stage"><canvas id="canvas"></canvas></div><div id="results" class="results"></div></div><div id="error" class="error"></div></section></main><script>const $=i=>document.getElementById(i),file=$('file'),drop=$('drop'),pick=$('pick'),work=$('work'),canvas=$('canvas'),ctx=canvas.getContext('2d'),ratio=$('ratio'),xp=$('xp'),yp=$('yp'),wp=$('wp'),hp=$('hp'),format=$('format'),results=$('results'),error=$('error');let files=[],bitmaps=[],sel={x:.1,y:.1,w:.8,h:.8},drawing=false,start=null;baseEvents();function baseEvents(){pick.onclick=e=>{e.stopPropagation();file.click()};drop.onclick=()=>file.click();file.onchange=()=>{load([...file.files]);file.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');load([...e.dataTransfer.files])};[xp,yp,wp,hp].forEach(i=>i.onchange=fromInputs);ratio.onchange=()=>{if(ratio.value!=='free'){let r=+ratio.value,b=bitmaps[0];if(!b)return;let w=.8,h=w*b.width/(r*b.height);if(h>.8){h=.8;w=h*r*b.height/b.width}sel={x:(1-w)/2,y:(1-h)/2,w,h};sync();draw()}}async function load(fs){hide();files=fs.filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type));if(!files.length){show('JPG, PNG, WebP 이미지를 선택해 주세요.');return}bitmaps.forEach(b=>b.close?.());bitmaps=[];for(const f of files)bitmaps.push(await createImageBitmap(f));work.style.display='block';sel={x:.1,y:.1,w:.8,h:.8};sync();draw();results.innerHTML=''}function draw(){const b=bitmaps[0];if(!b)return;canvas.width=b.width;canvas.height=b.height;ctx.drawImage(b,0,0);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,canvas.width,canvas.height);const x=sel.x*canvas.width,y=sel.y*canvas.height,w=sel.w*canvas.width,h=sel.h*canvas.height;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(b,0,0);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,canvas.width/500*2);ctx.strokeRect(x,y,w,h)}function point(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width,y:(p.clientY-r.top)/r.height}}function down(e){e.preventDefault();drawing=true;start=point(e)}function move(e){if(!drawing)return;e.preventDefault();let q=point(e),x=Math.max(0,Math.min(start.x,q.x)),y=Math.max(0,Math.min(start.y,q.y)),w=Math.abs(q.x-start.x),h=Math.abs(q.y-start.y);if(ratio.value!=='free'){const b=bitmaps[0],r=+ratio.value;h=w*b.width/(r*b.height);if(y+h>1)h=1-y;w=h*r*b.height/b.width}sel={x,y,w:Math.min(w,1-x),h:Math.min(h,1-y)};sync();draw()}function up(e){if(drawing){move(e);drawing=false}}canvas.addEventListener('mousedown',down);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',up);canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',()=>drawing=false);function sync(){xp.value=(sel.x*100).toFixed(1);yp.value=(sel.y*100).toFixed(1);wp.value=(sel.w*100).toFixed(1);hp.value=(sel.h*100).toFixed(1)}function fromInputs(){sel={x:(+xp.value||0)/100,y:(+yp.value||0)/100,w:(+wp.value||1)/100,h:(+hp.value||1)/100};sel.w=Math.min(sel.w,1-sel.x);sel.h=Math.min(sel.h,1-sel.y);draw()}$('run').onclick=()=>{if(!bitmaps.length)return;if(sel.w<=0||sel.h<=0){show('자를 영역을 지정해 주세요.');return}hide();results.innerHTML='';bitmaps.forEach((b,i)=>crop(b,files[i],i))};function crop(b,f,i){const sx=Math.round(sel.x*b.width),sy=Math.round(sel.y*b.height),sw=Math.max(1,Math.round(sel.w*b.width)),sh=Math.max(1,Math.round(sel.h*b.height)),c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d');if(format.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,sw,sh)}x.drawImage(b,sx,sy,sw,sh,0,0,sw,sh);c.toBlob(blob=>{const u=URL.createObjectURL(blob),d=document.createElement('div');d.className='item';d.innerHTML='<img><div></div><button>다운로드</button>';d.querySelector('img').src=u;d.querySelector('div').textContent=`${f.name} · ${sw}×${sh}`;d.querySelector('button').onclick=()=>{const a=document.createElement('a');a.href=u;a.download=f.name.replace(/\.[^.]+$/,'')+'_crop.'+ext();a.click()};results.appendChild(d)},format.value,.92)}function ext(){return format.value==='image/jpeg'?'jpg':format.value==='image/webp'?'webp':'png'}function show(t){error.textContent=t;error.style.display='block'}function hide(){error.style.display='none'}</script></body></html>
