<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이미지 PDF 변환 | JPG PNG WebP PDF 합치기</title>
<meta name="description" content="JPG, PNG, WebP 이미지를 서버 업로드 없이 브라우저에서 PDF로 변환하고 여러 장을 하나의 PDF로 합치세요.">
<script src="../lib/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#f5f7fb;color:#111827}.page{max-width:900px;margin:auto;padding:55px 20px 80px}.badge{display:inline-block;padding:7px 11px;border-radius:8px;background:#edf1ff;color:#465ee8;font-size:12px;font-weight:800;letter-spacing:1px}h1{margin:15px 0 7px;font-size:34px;letter-spacing:-1px}.subtitle{margin:0;color:#687386;line-height:1.7}.card{margin-top:24px;padding:28px;border:1px solid #e3e7ef;border-radius:18px;background:#fff;box-shadow:0 12px 35px rgba(30,50,100,.06)}.drop{border:2px dashed #abb7d5;border-radius:16px;padding:42px 20px;text-align:center;cursor:pointer}.drop.drag,.drop:hover{background:#f6f8ff;border-color:#5065e8}.drop strong{display:block;font-size:19px;margin-bottom:8px}.muted{font-size:14px;color:#8993a6}.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer;background:#4e5ee8;color:#fff}.pick{margin-top:18px}.privacy{margin-top:17px;padding:14px 16px;border-radius:11px;background:#effaf3;color:#376e4d;font-size:13px;line-height:1.6}.panel{display:none;margin-top:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar select{padding:11px 12px;border:1px solid #d9deea;border-radius:9px;background:white}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:70px 1fr auto;gap:13px;align-items:center;padding:10px;border:1px solid #e5e8f0;border-radius:12px;background:#fafbfe}.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#eee}.name{font-weight:700;word-break:break-all}.small{font-size:12px;color:#8993a6;margin-top:4px}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid #dce1ed;background:white;border-radius:7px;padding:7px 9px;cursor:pointer}.del{color:#b53d3d}.make{width:100%;margin-top:18px;font-size:16px}.result{display:none;margin-top:18px;padding:18px;border-radius:12px;background:#f2f5ff;text-align:center}.error{display:none;margin-top:18px;padding:14px;background:#fff0f0;color:#b23a3a;border-radius:10px;font-size:13px}@media(max-width:600px){.page{padding-top:30px}h1{font-size:27px}.card{padding:18px}.item{grid-template-columns:55px 1fr}.thumb{width:55px;height:55px}.actions{grid-column:1/-1}}
</style></head><body>
<div class="page"><span class="badge">FREE WORK TOOLS</span><h1>이미지 → PDF 변환기</h1><p class="subtitle">JPG · PNG · WebP 여러 장을 원하는 순서로 정리해 하나의 PDF로 저장하세요.<br>파일은 서버로 전송하지 않고 현재 브라우저 안에서 처리합니다.</p>
<div class="card"><div id="drop" class="drop"><strong>이미지를 여기에 드래그하세요</strong><span class="muted">여러 장을 한 번에 선택할 수 있습니다.</span><br><button id="pick" class="btn pick">이미지 선택</button><input id="input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div>
<div class="privacy">🔒 선택한 이미지는 별도 서버에 업로드하지 않습니다. PDF 생성은 현재 브라우저에서 수행됩니다.</div>
<div id="panel" class="panel"><div class="toolbar"><button id="add" class="mini">+ 이미지 추가</button><label>페이지 <select id="pageMode"><option value="image">이미지 크기 맞춤</option><option value="a4">A4 맞춤</option></select></label><span class="muted">↑↓ 버튼으로 순서를 바꿀 수 있습니다.</span></div><div id="list" class="list"></div><button id="make" class="btn make">PDF 만들기 및 다운로드</button></div><div id="error" class="error"></div><div id="result" class="result">✓ PDF 생성이 완료되어 다운로드했습니다.</div></div></div>
<script>
const input=document.getElementById('input'),pick=document.getElementById('pick'),add=document.getElementById('add'),drop=document.getElementById('drop'),panel=document.getElementById('panel'),list=document.getElementById('list'),make=document.getElementById('make'),pageMode=document.getElementById('pageMode'),errorBox=document.getElementById('error'),result=document.getElementById('result');let items=[];
pick.onclick=e=>{e.stopPropagation();input.click()};add.onclick=()=>input.click();drop.onclick=()=>input.click();input.onchange=()=>{addFiles([...input.files]);input.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');addFiles([...e.dataTransfer.files])};
async function addFiles(files){hideError();for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type))continue;items.push({file:f,url:URL.createObjectURL(f),rot:0})}render()}
function render(){panel.style.display=items.length?'block':'none';result.style.display='none';list.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<img class="thumb" src="${it.url}" style="transform:rotate(${it.rot}deg)"><div><div class="name"></div><div class="small">${fmt(it.file.size)} · 회전 ${it.rot}°</div></div><div class="actions"><button class="mini up">↑</button><button class="mini down">↓</button><button class="mini rotate">↻ 회전</button><button class="mini del">삭제</button></div>`;d.querySelector('.name').textContent=it.file.name;d.querySelector('.up').onclick=()=>move(i,-1);d.querySelector('.down').onclick=()=>move(i,1);d.querySelector('.rotate').onclick=()=>{it.rot=(it.rot+90)%360;render()};d.querySelector('.del').onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);render()};list.appendChild(d)})}
function move(i,n){const j=i+n;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}
async function toJpegBytes(it){const bmp=await createImageBitmap(it.file),swap=it.rot%180!==0,c=document.createElement('canvas');c.width=swap?bmp.height:bmp.width;c.height=swap?bmp.width:bmp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(it.rot*Math.PI/180);x.drawImage(bmp,-bmp.width/2,-bmp.height/2);const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',0.92));bmp.close?.();return{bytes:await blob.arrayBuffer(),w:c.width,h:c.height}}
make.onclick=async()=>{if(!items.length)return;hideError();result.style.display='none';make.disabled=true;make.textContent='PDF 만드는 중...';try{if(!window.PDFLib)throw new Error('PDF 라이브러리를 불러오지 못했습니다.');const pdf=await PDFLib.PDFDocument.create();for(const it of items){const o=await toJpegBytes(it),img=await pdf.embedJpg(o.bytes);let pw=o.w,ph=o.h,x=0,y=0,w=pw,h=ph;if(pageMode.value==='a4'){pw=595.28;ph=841.89;const margin=28,scale=Math.min((pw-margin*2)/o.w,(ph-margin*2)/o.h,1);w=o.w*scale;h=o.h*scale;x=(pw-w)/2;y=(ph-h)/2}const page=pdf.addPage([pw,ph]);page.drawImage(img,{x,y,width:w,height:h})}const bytes=await pdf.save(),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='images_to_pdf.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);result.style.display='block'}catch(e){console.error(e);showError('PDF 생성 중 오류가 발생했습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.')}finally{make.disabled=false;make.textContent='PDF 만들기 및 다운로드'}};
function fmt(n){if(!n)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return(n/1024**i).toFixed(i?2:0)+' '+u[i]}function showError(t){errorBox.textContent=t;errorBox.style.display='block'}function hideError(){errorBox.style.display='none'}
</script></body></html>
