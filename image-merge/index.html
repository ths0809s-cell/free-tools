<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>여러 이미지 한 장으로 합치기 | 무료 이미지 병합</title><meta name="description" content="JPG PNG WebP 여러 이미지를 세로, 가로, 격자로 한 장에 합치세요. 서버 업로드 없이 브라우저에서 처리합니다."><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#f5f7fb;color:#111827}.page{max-width:920px;margin:auto;padding:55px 20px 80px}.badge{display:inline-block;padding:7px 11px;border-radius:8px;background:#edf1ff;color:#465ee8;font-size:12px;font-weight:800;letter-spacing:1px}h1{margin:15px 0 7px;font-size:34px;letter-spacing:-1px}.subtitle{margin:0;color:#687386;line-height:1.7}.card{margin-top:24px;padding:28px;border:1px solid #e3e7ef;border-radius:18px;background:#fff;box-shadow:0 12px 35px rgba(30,50,100,.06)}.drop{border:2px dashed #abb7d5;border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer}.drop:hover,.drop.drag{background:#f6f8ff;border-color:#5065e8}.drop strong{display:block;font-size:19px;margin-bottom:7px}.muted{font-size:13px;color:#8993a6}.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer;background:#4e5ee8;color:#fff}.pick{margin-top:17px}.privacy{margin-top:17px;padding:14px 16px;border-radius:11px;background:#effaf3;color:#376e4d;font-size:13px;line-height:1.6}.panel{display:none;margin-top:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:16px;background:#f8f9fd;border-radius:12px}.controls label{font-size:12px;color:#687386}.controls select,.controls input{display:block;margin-top:5px;padding:10px;border:1px solid #d9deea;border-radius:8px;background:#fff;min-width:105px}.list{display:grid;gap:9px;margin-top:15px}.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid #e5e8f0;border-radius:11px}.thumb{width:64px;height:64px;object-fit:cover;border-radius:7px;background:#eee}.name{font-weight:700;word-break:break-all}.small{font-size:12px;color:#8993a6;margin-top:4px}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid #dce1ed;background:white;border-radius:7px;padding:7px 9px;cursor:pointer}.del{color:#b53d3d}.make{width:100%;margin-top:17px;font-size:16px}.preview{display:none;margin-top:18px;padding:16px;background:#f8f9fd;border-radius:12px;text-align:center}.preview img{max-width:100%;max-height:520px;border:1px solid #e0e4ec;background:#fff}.preview .info{margin:9px 0;color:#687386;font-size:13px}.download{margin-top:5px}.error{display:none;margin-top:15px;padding:14px;background:#fff0f0;color:#b23a3a;border-radius:10px}@media(max-width:620px){.page{padding-top:30px}h1{font-size:27px}.card{padding:18px}.item{grid-template-columns:52px 1fr}.thumb{width:52px;height:52px}.actions{grid-column:1/-1}}</style></head><body><main class="page"><span class="badge">FREE WORK TOOLS</span><h1>여러 이미지 한 장으로 합치기</h1><p class="subtitle">스크린샷과 사진 여러 장을 세로 · 가로 · 격자 형태로 한 장에 합치세요.<br>파일은 서버로 전송하지 않고 현재 브라우저에서 처리합니다.</p><section class="card"><div id="drop" class="drop"><strong>이미지를 여기에 드래그하세요</strong><span class="muted">JPG · PNG · WebP / 여러 장 선택 가능</span><br><button id="pick" class="btn pick">이미지 선택</button><input id="input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div class="privacy">🔒 선택한 이미지는 별도 서버에 업로드하지 않습니다. 이미지 병합은 현재 브라우저에서 수행됩니다.</div><div id="panel" class="panel"><div class="controls"><label>합치기 방식<select id="mode"><option value="vertical">세로로 길게</option><option value="horizontal">가로로 길게</option><option value="grid">격자로 배치</option></select></label><label id="colbox" style="display:none">격자 열 수<input id="cols" type="number" min="1" max="10" value="2"></label><label>이미지 사이 여백(px)<input id="gap" type="number" min="0" max="200" value="10"></label><label>바깥 여백(px)<input id="outer" type="number" min="0" max="300" value="10"></label><label>배경<select id="bg"><option value="white">흰색</option><option value="transparent">투명</option><option value="black">검정</option></select></label><label>저장 형식<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label></div><div id="list" class="list"></div><button id="make" class="btn make">이미지 합치기</button></div><div id="error" class="error"></div><div id="preview" class="preview"><img id="outimg" alt="합쳐진 이미지 미리보기"><div id="info" class="info"></div><button id="download" class="btn download">합쳐진 이미지 다운로드</button></div></section></main><script>const input=document.getElementById('input'),pick=document.getElementById('pick'),drop=document.getElementById('drop'),panel=document.getElementById('panel'),list=document.getElementById('list'),mode=document.getElementById('mode'),cols=document.getElementById('cols'),colbox=document.getElementById('colbox'),gap=document.getElementById('gap'),outer=document.getElementById('outer'),bg=document.getElementById('bg'),format=document.getElementById('format'),make=document.getElementById('make'),preview=document.getElementById('preview'),outimg=document.getElementById('outimg'),info=document.getElementById('info'),download=document.getElementById('download'),errorBox=document.getElementById('error');let items=[],lastUrl=null,lastBlob=null;pick.onclick=e=>{e.stopPropagation();input.click()};drop.onclick=()=>input.click();input.onchange=()=>{addFiles([...input.files]);input.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');addFiles([...e.dataTransfer.files])};mode.onchange=()=>colbox.style.display=mode.value==='grid'?'block':'none';async function addFiles(files){hideError();for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type))continue;try{const b=await createImageBitmap(f);items.push({file:f,url:URL.createObjectURL(f),w:b.width,h:b.height});b.close?.()}catch(e){}}render()}function render(){panel.style.display=items.length?'block':'none';preview.style.display='none';list.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<img class="thumb" src="${it.url}"><div><div class="name"></div><div class="small">${it.w} × ${it.h}px · ${fmt(it.file.size)}</div></div><div class="actions"><button class="mini up">↑</button><button class="mini down">↓</button><button class="mini del">삭제</button></div>`;d.querySelector('.name').textContent=it.file.name;d.querySelector('.up').onclick=()=>move(i,-1);d.querySelector('.down').onclick=()=>move(i,1);d.querySelector('.del').onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);render()};list.appendChild(d)})}function move(i,n){const j=i+n;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}async function loadAll(){const arr=[];for(const it of items)arr.push(await createImageBitmap(it.file));return arr}make.onclick=async()=>{if(items.length<2){showError('합칠 이미지를 2장 이상 선택해 주세요.');return}hideError();make.disabled=true;make.textContent='이미지 합치는 중...';try{const imgs=await loadAll(),g=Math.max(0,+gap.value||0),o=Math.max(0,+outer.value||0);let cw=0,ch=0,draw=[];if(mode.value==='vertical'){cw=Math.max(...imgs.map(x=>x.width))+o*2;let y=o;for(const x of imgs){draw.push({img:x,x:o+(cw-o*2-x.width)/2,y,w:x.width,h:x.height});y+=x.height+g}ch=y-g+o}else if(mode.value==='horizontal'){ch=Math.max(...imgs.map(x=>x.height))+o*2;let x=o;for(const im of imgs){draw.push({img:im,x,y:o+(ch-o*2-im.height)/2,w:im.width,h:im.height});x+=im.width+g}cw=x-g+o}else{const c=Math.max(1,Math.min(10,+cols.value||2)),rows=Math.ceil(imgs.length/c),cellW=Math.max(...imgs.map(x=>x.width)),cellH=Math.max(...imgs.map(x=>x.height));cw=o*2+c*cellW+(c-1)*g;ch=o*2+rows*cellH+(rows-1)*g;imgs.forEach((im,i)=>{const col=i%c,row=Math.floor(i/c);draw.push({img:im,x:o+col*(cellW+g)+(cellW-im.width)/2,y:o+row*(cellH+g)+(cellH-im.height)/2,w:im.width,h:im.height})})}if(cw*ch>120000000)throw new Error('too large');const c=document.createElement('canvas');c.width=Math.ceil(cw);c.height=Math.ceil(ch);const x=c.getContext('2d');if(bg.value!=='transparent'||format.value==='image/jpeg'){x.fillStyle=bg.value==='black'?'#000':'#fff';x.fillRect(0,0,c.width,c.height)}draw.forEach(d=>x.drawImage(d.img,d.x,d.y,d.w,d.h));imgs.forEach(im=>im.close?.());lastBlob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),format.value,.92));if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(lastBlob);outimg.src=lastUrl;info.textContent=`결과 크기: ${c.width} × ${c.height}px · ${fmt(lastBlob.size)}`;preview.style.display='block';preview.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){console.error(e);showError('이미지 합치기에 실패했습니다. 이미지가 너무 크면 장수를 줄이거나 원본 크기를 줄인 뒤 다시 시도해 주세요.')}finally{make.disabled=false;make.textContent='이미지 합치기'}};download.onclick=()=>{if(!lastBlob)return;const ext=lastBlob.type==='image/jpeg'?'jpg':lastBlob.type==='image/webp'?'webp':'png',a=document.createElement('a');a.href=lastUrl;a.download='merged_image.'+ext;document.body.appendChild(a);a.click();a.remove()};function fmt(n){if(!n)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return(n/1024**i).toFixed(i?2:0)+' '+u[i]}function showError(t){errorBox.textContent=t;errorBox.style.display='block'}function hideError(){errorBox.style.display='none'}</script></body></html>
