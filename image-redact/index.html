<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 모자이크 개인정보 가리기 | 무료 이미지 도구</title><meta name="description" content="사진과 스크린샷에서 개인정보를 모자이크, 블러, 검정 또는 흰색으로 가립니다. 서버 업로드 없이 브라우저에서 처리합니다."><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}.page{max-width:1000px;margin:auto;padding:50px 20px 80px}.badge{display:inline-block;padding:7px 11px;border-radius:8px;background:#edf1ff;color:#465ee8;font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:34px;margin:15px 0 7px}.sub{color:#687386;line-height:1.7}.card{margin-top:24px;padding:25px;background:#fff;border:1px solid #e3e7ef;border-radius:18px;box-shadow:0 12px 35px rgba(30,50,100,.06)}.drop{border:2px dashed #abb7d5;border-radius:15px;padding:38px 20px;text-align:center;cursor:pointer}.drop:hover,.drop.drag{background:#f6f8ff}.btn{border:0;border-radius:9px;padding:12px 17px;background:#4e5ee8;color:#fff;font-weight:700;cursor:pointer}.pick{margin-top:15px}.privacy{margin-top:16px;padding:14px 16px;background:#effaf3;color:#376e4d;border-radius:10px;font-size:13px}.editor{display:none;margin-top:20px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:13px;background:#f8f9fd;border-radius:11px}.tool,.undo{padding:9px 12px;border:1px solid #d9deea;background:#fff;border-radius:8px;cursor:pointer;font-weight:650}.tool.active{background:#4e5ee8;color:#fff;border-color:#4e5ee8}.range{display:flex;align-items:center;gap:6px;font-size:12px;color:#687386}.range input{width:100px}.canvaswrap{margin-top:14px;overflow:auto;text-align:center;background:#eef1f6;border-radius:10px;padding:10px}.canvaswrap canvas{max-width:100%;height:auto;display:block;margin:auto;cursor:crosshair;touch-action:none;background:#fff}.hint{font-size:13px;color:#737d90;margin:10px 0 0;text-align:center}.bottom{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.bottom select{padding:11px;border:1px solid #d9deea;border-radius:8px;background:#fff}.bottom .save{flex:1;min-width:210px}.error{display:none;margin-top:14px;padding:13px;background:#fff0f0;color:#b23a3a;border-radius:9px}@media(max-width:600px){.page{padding-top:30px}h1{font-size:27px}.card{padding:17px}.toolbar{align-items:stretch}.range{width:100%}}</style></head><body><main class="page"><span class="badge">FREE WORK TOOLS</span><h1>사진 모자이크 · 개인정보 가리기</h1><p class="sub">사진이나 스크린샷에서 가릴 영역을 마우스 또는 손가락으로 드래그하세요.<br>모자이크 · 블러 · 검정 가리기 · 흰색 가리기를 지원합니다.</p><section class="card"><div id="drop" class="drop"><strong>이미지를 여기에 드래그하세요</strong><div style="font-size:13px;color:#8993a6;margin-top:7px">JPG · PNG · WebP</div><button id="pick" class="btn pick">이미지 선택</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div class="privacy">🔒 선택한 이미지는 별도 서버에 업로드하지 않습니다. 모든 편집은 현재 브라우저에서 처리됩니다.</div><div id="editor" class="editor"><div class="toolbar"><button class="tool active" data-tool="pixel">모자이크</button><button class="tool" data-tool="blur">블러</button><button class="tool" data-tool="black">검정 가리기</button><button class="tool" data-tool="white">흰색 가리기</button><label class="range"><span id="strengthLabel">강도 14</span><input id="strength" type="range" min="4" max="40" value="14"></label><button id="undo" class="undo">↶ 실행취소</button><button id="reset" class="undo">원본으로</button></div><div class="canvaswrap"><canvas id="canvas"></canvas></div><p class="hint">가리고 싶은 영역을 드래그하세요. 여러 영역을 계속 지정할 수 있습니다.</p><div class="bottom"><select id="format"><option value="image/png">PNG 저장</option><option value="image/jpeg">JPG 저장</option><option value="image/webp">WebP 저장</option></select><button id="save" class="btn save">편집 이미지 다운로드</button></div></div><div id="error" class="error"></div></section></main><script>const file=document.getElementById('file'),pick=document.getElementById('pick'),drop=document.getElementById('drop'),editor=document.getElementById('editor'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),strength=document.getElementById('strength'),strengthLabel=document.getElementById('strengthLabel'),undo=document.getElementById('undo'),reset=document.getElementById('reset'),save=document.getElementById('save'),format=document.getElementById('format'),errorBox=document.getElementById('error');let tool='pixel',history=[],original=null,drawing=false,start=null,previewBackup=null;document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool});strength.oninput=()=>strengthLabel.textContent='강도 '+strength.value;pick.onclick=e=>{e.stopPropagation();file.click()};drop.onclick=()=>file.click();file.onchange=()=>{if(file.files[0])load(file.files[0]);file.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};async function load(f){hideError();if(!['image/jpeg','image/png','image/webp'].includes(f.type)){showError('JPG, PNG, WebP 이미지를 선택해 주세요.');return}try{const b=await createImageBitmap(f);canvas.width=b.width;canvas.height=b.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(b,0,0);b.close?.();original=ctx.getImageData(0,0,canvas.width,canvas.height);history=[];editor.style.display='block'}catch(e){showError('이미지를 불러오지 못했습니다.')}}function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:Math.max(0,Math.min(canvas.width,(p.clientX-r.left)*canvas.width/r.width)),y:Math.max(0,Math.min(canvas.height,(p.clientY-r.top)*canvas.height/r.height))}}function down(e){e.preventDefault();drawing=true;start=pos(e);previewBackup=ctx.getImageData(0,0,canvas.width,canvas.height)}function move(e){if(!drawing)return;e.preventDefault();ctx.putImageData(previewBackup,0,0);const q=pos(e);ctx.save();ctx.strokeStyle='#4e5ee8';ctx.lineWidth=Math.max(2,canvas.width/canvas.clientWidth*2);ctx.setLineDash([8,6]);ctx.strokeRect(Math.min(start.x,q.x),Math.min(start.y,q.y),Math.abs(q.x-start.x),Math.abs(q.y-start.y));ctx.restore()}function up(e){if(!drawing)return;e.preventDefault();drawing=false;ctx.putImageData(previewBackup,0,0);const q=pos(e),x=Math.round(Math.min(start.x,q.x)),y=Math.round(Math.min(start.y,q.y)),w=Math.round(Math.abs(q.x-start.x)),h=Math.round(Math.abs(q.y-start.y));if(w<2||h<2)return;history.push(previewBackup);apply(x,y,w,h)}canvas.addEventListener('mousedown',down);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',up);canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',e=>{if(!drawing)return;const t=e.changedTouches[0],fake={clientX:t.clientX,clientY:t.clientY,preventDefault:()=>{}};up(fake)},{passive:false});function apply(x,y,w,h){if(tool==='black'||tool==='white'){ctx.fillStyle=tool==='black'?'#000':'#fff';ctx.fillRect(x,y,w,h);return}const temp=document.createElement('canvas');temp.width=w;temp.height=h;const t=temp.getContext('2d');t.drawImage(canvas,x,y,w,h,0,0,w,h);if(tool==='pixel'){const s=Math.max(4,+strength.value),sw=Math.max(1,Math.ceil(w/s)),sh=Math.max(1,Math.ceil(h/s)),tiny=document.createElement('canvas');tiny.width=sw;tiny.height=sh;const z=tiny.getContext('2d');z.imageSmoothingEnabled=false;z.drawImage(temp,0,0,sw,sh);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(tiny,0,0,sw,sh,x,y,w,h);ctx.restore()}else{const b=Math.max(2,Math.round(+strength.value/2));ctx.save();ctx.filter=`blur(${b}px)`;ctx.drawImage(temp,-b,-b,w+2*b,h+2*b,x,y,w,h);ctx.restore()}}undo.onclick=()=>{if(!history.length)return;ctx.putImageData(history.pop(),0,0)};reset.onclick=()=>{if(!original)return;ctx.putImageData(original,0,0);history=[]};save.onclick=()=>{if(!canvas.width)return;let type=format.value,quality=.92;if(type==='image/jpeg'){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,0);c.toBlob(b=>downloadBlob(b,type),type,quality)}else canvas.toBlob(b=>downloadBlob(b,type),type,quality)};function downloadBlob(b,type){if(!b){showError('이미지 저장에 실패했습니다.');return}const ext=type==='image/jpeg'?'jpg':type==='image/webp'?'webp':'png',u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='redacted_image.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}function showError(t){errorBox.textContent=t;errorBox.style.display='block'}function hideError(){errorBox.style.display='none'}</script></body></html>
