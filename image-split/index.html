<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>긴 이미지 자동 분할 | 스크린샷 나누기</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif}.p{max-width:960px;margin:auto;padding:48px 20px 80px}.badge{display:inline-block;padding:7px 11px;background:#edf1ff;color:#465ee8;border-radius:8px;font-size:12px;font-weight:800}h1{font-size:34px;margin:14px 0 7px}.sub{color:#687386;line-height:1.7}.card{margin-top:24px;background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:25px}.drop{padding:38px 20px;border:2px dashed #abb7d5;border-radius:14px;text-align:center;cursor:pointer}.drop.drag{background:#f6f8ff}.btn{border:0;border-radius:9px;padding:12px 17px;background:#4e5ee8;color:#fff;font-weight:700;cursor:pointer}.pick{margin-top:14px}.privacy{margin-top:15px;padding:14px;background:#effaf3;color:#376e4d;border-radius:10px;font-size:13px}.work{display:none;margin-top:20px}.controls{display:flex;flex-wrap:wrap;gap:10px;padding:15px;background:#f8f9fd;border-radius:11px;align-items:end}.controls label{font-size:12px;color:#687386}.controls select,.controls input{display:block;margin-top:5px;padding:10px;border:1px solid #d9deea;border-radius:8px;background:#fff}.summary{margin:14px 0;color:#596579;font-size:14px}.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.piece{border:1px solid #e1e5ee;border-radius:10px;padding:9px;background:#fff}.piece img{width:100%;height:170px;object-fit:contain;background:#eef1f6}.piece div{font-size:12px;color:#687386;margin:6px 0}.piece button{width:100%;padding:8px;border:0;border-radius:7px;background:#f0f2ff;color:#465ee8;font-weight:700;cursor:pointer}.error{display:none;margin-top:14px;padding:13px;background:#fff0f0;color:#b23a3a;border-radius:9px}@media(max-width:600px){h1{font-size:27px}.card{padding:17px}}</style></head><body><main class="p"><span class="badge">FREE WORK TOOLS</span><h1>긴 이미지 자동 분할기</h1><p class="sub">긴 스크린샷이나 세로 이미지를 원하는 높이 또는 개수로 자동 분할하세요. 원본 해상도를 유지합니다.</p><section class="card"><div id="drop" class="drop"><b>긴 이미지를 여기에 드래그하세요</b><br><button id="pick" class="btn pick">이미지 선택</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div class="privacy">🔒 이미지는 서버로 업로드하지 않고 현재 브라우저에서 처리합니다.</div><div id="work" class="work"><div class="controls"><label>분할 방식<select id="mode"><option value="count">개수로 균등 분할</option><option value="height">높이(px)로 분할</option><option value="a4">A4 세로 비율로 분할</option></select></label><label id="countBox">분할 개수<input id="count" type="number" min="2" max="50" value="3"></label><label id="heightBox" style="display:none">조각 높이(px)<input id="height" type="number" min="100" value="1000"></label><label>저장 형식<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><button id="run" class="btn">자동 분할</button></div><div id="summary" class="summary"></div><div id="preview" class="preview"></div></div><div id="error" class="error"></div></section></main><script>const $=id=>document.getElementById(id),drop=$('drop'),file=$('file'),pick=$('pick'),work=$('work'),mode=$('mode'),countBox=$('countBox'),heightBox=$('heightBox'),count=$('count'),height=$('height'),format=$('format'),preview=$('preview'),summary=$('summary'),error=$('error');let img=null,name='image';pick.onclick=e=>{e.stopPropagation();file.click()};drop.onclick=()=>file.click();file.onchange=()=>{if(file.files[0])load(file.files[0]);file.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};mode.onchange=()=>{countBox.style.display=mode.value==='count'?'block':'none';heightBox.style.display=mode.value==='height'?'block':'none'};async function load(f){hide();try{img?.close?.();img=await createImageBitmap(f);name=f.name.replace(/\.[^.]+$/,'');work.style.display='block';summary.textContent=`원본: ${img.width} × ${img.height}px`;preview.innerHTML=''}catch(e){show('이미지를 불러오지 못했습니다.')}}$('run').onclick=()=>{if(!img)return;hide();preview.innerHTML='';let cuts=[];if(mode.value==='count'){const n=Math.max(2,Math.min(50,+count.value||3)),base=Math.floor(img.height/n);for(let i=0;i<n;i++){let y=i*base,h=i===n-1?img.height-y:base;cuts.push([y,h])}}else{let h;if(mode.value==='a4')h=Math.max(1,Math.round(img.width*297/210));else h=Math.max(100,+height.value||1000);for(let y=0;y<img.height;y+=h)cuts.push([y,Math.min(h,img.height-y)])}summary.textContent=`원본 ${img.width} × ${img.height}px → 총 ${cuts.length}개 이미지`;cuts.forEach((c,i)=>makePiece(c[0],c[1],i))};function makePiece(y,h,i){const c=document.createElement('canvas');c.width=img.width;c.height=h;const x=c.getContext('2d');if(format.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,y,img.width,h,0,0,img.width,h);c.toBlob(b=>{const u=URL.createObjectURL(b),d=document.createElement('div');d.className='piece';d.innerHTML=`<img><div>조각 ${i+1} · ${img.width} × ${h}px</div><button>다운로드</button>`;d.querySelector('img').src=u;d.querySelector('button').onclick=()=>{const a=document.createElement('a');a.href=u;a.download=`${name}_part_${String(i+1).padStart(2,'0')}.${ext()}`;a.click()};preview.appendChild(d)},format.value,.92)}function ext(){return format.value==='image/jpeg'?'jpg':format.value==='image/webp'?'webp':'png'}function show(t){error.textContent=t;error.style.display='block'}function hide(){error.style.display='none'}</script></body></html>
