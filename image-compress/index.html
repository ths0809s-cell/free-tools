<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이미지 용량 줄이기 | 무료 JPG PNG WebP 압축</title>
<meta name="description" content="JPG, PNG, WebP 이미지를 서버 업로드 없이 브라우저에서 바로 압축하세요.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#f5f7fb;color:#111827}.page{max-width:820px;margin:auto;padding:55px 20px 80px}.badge{display:inline-block;padding:7px 11px;border-radius:8px;background:#edf1ff;color:#465ee8;font-size:12px;font-weight:800;letter-spacing:1px}h1{margin:15px 0 7px;font-size:34px;letter-spacing:-1px}.subtitle{margin:0;color:#687386;line-height:1.7}.card{margin-top:24px;padding:28px;border:1px solid #e3e7ef;border-radius:18px;background:#fff;box-shadow:0 12px 35px rgba(30,50,100,.06)}.drop{border:2px dashed #abb7d5;border-radius:16px;padding:48px 20px;text-align:center;cursor:pointer}.drop.drag,.drop:hover{background:#f6f8ff;border-color:#5065e8}.drop strong{display:block;font-size:19px;margin-bottom:8px}.muted{font-size:14px;color:#8993a6}.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer;background:#4e5ee8;color:#fff}.pick{margin-top:18px}.privacy{margin-top:17px;padding:14px 16px;border-radius:11px;background:#effaf3;color:#376e4d;font-size:13px;line-height:1.6}.panel{display:none;margin-top:22px}.file{padding:16px;border-radius:12px;background:#f7f8fc;word-break:break-all}.quality{margin-top:18px}.quality-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:9px}.quality input{width:100%}.note{margin-top:8px;color:#8991a0;font-size:12px;line-height:1.5}.action{width:100%;margin-top:20px;font-size:16px}.result{display:none;margin-top:24px;padding:22px;border-radius:15px;background:#f2f5ff;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#fff;padding:14px 8px;border-radius:10px}.label{font-size:12px;color:#8790a1}.value{margin-top:5px;font-size:18px;font-weight:800}.saved{color:#2b8b57}.preview{max-width:100%;max-height:330px;border-radius:10px;margin:10px auto 18px;display:block}.error{display:none;margin-top:18px;padding:14px;background:#fff0f0;color:#b23a3a;border-radius:10px;font-size:13px}@media(max-width:600px){.page{padding-top:30px}h1{font-size:27px}.card{padding:18px}.stats{grid-template-columns:1fr}}
</style></head><body>
<div class="page"><span class="badge">FREE WORK TOOLS</span><h1>이미지 용량 줄이기</h1><p class="subtitle">JPG · PNG · WebP 이미지를 설치 없이 바로 압축하세요.<br>파일은 서버로 전송하지 않고 브라우저 안에서 처리합니다.</p>
<div class="card"><div id="drop" class="drop"><strong>이미지를 여기에 드래그하세요</strong><span class="muted">또는 아래 버튼을 눌러 이미지를 선택하세요.</span><br><button id="pick" class="btn pick">이미지 선택</button><input id="input" type="file" accept="image/jpeg,image/png,image/webp" hidden></div>
<div class="privacy">🔒 선택한 이미지는 서버에 업로드하지 않습니다. 변환과 압축은 현재 브라우저에서만 처리됩니다.</div>
<div id="panel" class="panel"><div id="file" class="file"></div><div class="quality"><div class="quality-head"><span>압축 품질</span><span id="qText">75%</span></div><input id="quality" type="range" min="35" max="95" value="75" step="5"><div class="note">품질을 낮출수록 파일 크기는 작아집니다. PNG는 압축 결과를 WebP로 저장해 용량 감소 효과를 높입니다.</div></div><button id="compress" class="btn action">이미지 압축 시작</button></div>
<div id="error" class="error"></div><div id="result" class="result"><h2>✓ 이미지 압축 완료</h2><img id="preview" class="preview" alt="압축 결과 미리보기"><div class="stats"><div class="stat"><div class="label">원본</div><div id="before" class="value"></div></div><div class="stat"><div class="label">압축 후</div><div id="after" class="value"></div></div><div class="stat"><div class="label">감소율</div><div id="saved" class="value saved"></div></div></div><button id="download" class="btn action">압축된 이미지 다운로드</button></div></div></div>
<script>
const input=document.getElementById('input'),pick=document.getElementById('pick'),drop=document.getElementById('drop'),panel=document.getElementById('panel'),fileBox=document.getElementById('file'),quality=document.getElementById('quality'),qText=document.getElementById('qText'),compress=document.getElementById('compress'),result=document.getElementById('result'),preview=document.getElementById('preview'),before=document.getElementById('before'),after=document.getElementById('after'),saved=document.getElementById('saved'),download=document.getElementById('download'),errorBox=document.getElementById('error');let selected=null,outBlob=null,outUrl=null,outExt='webp';
pick.onclick=e=>{e.stopPropagation();input.click()};drop.onclick=()=>input.click();input.onchange=()=>input.files[0]&&load(input.files[0]);quality.oninput=()=>qText.textContent=quality.value+'%';drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
function load(f){hideError();if(!['image/jpeg','image/png','image/webp'].includes(f.type)){showError('JPG, PNG, WebP 이미지 파일만 선택할 수 있습니다.');return}selected=f;fileBox.textContent=f.name+' · '+fmt(f.size);panel.style.display='block';result.style.display='none'}
compress.onclick=async()=>{if(!selected)return;hideError();compress.disabled=true;try{const bmp=await createImageBitmap(selected),canvas=document.createElement('canvas');canvas.width=bmp.width;canvas.height=bmp.height;const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(bmp,0,0);const type=selected.type==='image/jpeg'?'image/jpeg':'image/webp';outExt=type==='image/jpeg'?'jpg':'webp';outBlob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('변환 실패')),type,Number(quality.value)/100));if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(outBlob);preview.src=outUrl;before.textContent=fmt(selected.size);after.textContent=fmt(outBlob.size);const pct=(1-outBlob.size/selected.size)*100;saved.textContent=pct>=0?pct.toFixed(1)+'%':'용량 증가';result.style.display='block';bmp.close?.()}catch(e){console.error(e);showError('이미지 처리 중 오류가 발생했습니다. 다른 이미지로 다시 시도해 주세요.')}finally{compress.disabled=false}};
download.onclick=()=>{if(!outBlob)return;const a=document.createElement('a'),base=selected.name.replace(/\.[^.]+$/,'');a.href=outUrl;a.download=base+'_compressed.'+outExt;document.body.appendChild(a);a.click();a.remove()};function fmt(n){if(!n)return'0 B';const u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(1024));return(n/1024**i).toFixed(i?2:0)+' '+u[i]}function showError(t){errorBox.textContent=t;errorBox.style.display='block'}function hideError(){errorBox.style.display='none'}
</script></body></html>
