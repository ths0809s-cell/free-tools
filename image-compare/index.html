<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두 이미지 비교 | Before After 차이 비교</title><meta name="description" content="두 사진과 스크린샷을 슬라이더, 겹쳐보기, 차이 강조 방식으로 비교하세요. 서버 업로드 없이 브라우저에서 처리합니다."><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}.page{max-width:1050px;margin:auto;padding:50px 20px 80px}.badge{display:inline-block;padding:7px 11px;border-radius:8px;background:#edf1ff;color:#465ee8;font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:34px;margin:15px 0 7px}.sub{margin:0;color:#687386;line-height:1.7}.card{margin-top:24px;padding:25px;background:#fff;border:1px solid #e3e7ef;border-radius:18px;box-shadow:0 12px 35px rgba(30,50,100,.06)}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.drop{border:2px dashed #abb7d5;border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;min-height:145px}.drop:hover,.drop.drag{background:#f6f8ff;border-color:#5065e8}.drop b{display:block;font-size:18px;margin-bottom:5px}.drop .name{margin-top:10px;font-size:12px;color:#687386;word-break:break-all}.btn{border:0;border-radius:9px;padding:11px 16px;background:#4e5ee8;color:#fff;font-weight:700;cursor:pointer}.pick{margin-top:13px}.privacy{margin-top:16px;padding:14px 16px;background:#effaf3;color:#376e4d;border-radius:10px;font-size:13px}.workspace{display:none;margin-top:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:13px;background:#f8f9fd;border-radius:11px}.mode{padding:9px 12px;border:1px solid #d9deea;background:#fff;border-radius:8px;cursor:pointer;font-weight:650}.mode.active{background:#4e5ee8;color:#fff;border-color:#4e5ee8}.control{display:flex;align-items:center;gap:6px;font-size:12px;color:#687386}.control input{width:120px}.stage{position:relative;margin-top:14px;background:#e9edf4;border-radius:12px;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center}.stage canvas{display:block;max-width:100%;height:auto}.sliderLine{display:none;position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}.sliderLine:after{content:'↔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#4e5ee8;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 10px #0003}.rangeSlider{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.stat{padding:12px;background:#f8f9fd;border-radius:9px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:#7b8495}.hint{text-align:center;color:#7b8495;font-size:13px;margin-top:10px}.error{display:none;margin-top:14px;padding:13px;background:#fff0f0;color:#b23a3a;border-radius:9px}@media(max-width:650px){.page{padding-top:30px}h1{font-size:27px}.card{padding:17px}.inputs{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.control{width:100%}}</style></head><body><main class="page"><span class="badge">FREE WORK TOOLS</span><h1>두 이미지 Before / After 비교</h1><p class="sub">수정 전·후 사진이나 스크린샷 두 장을 슬라이더로 넘겨보고, 겹쳐보고, 픽셀 차이를 강조해서 확인하세요.</p><section class="card"><div class="inputs"><div id="dropA" class="drop"><b>① BEFORE 이미지</b><span style="font-size:13px;color:#8993a6">원본 또는 수정 전 이미지</span><br><button class="btn pick" data-id="A">이미지 선택</button><div id="nameA" class="name">선택된 파일 없음</div></div><div id="dropB" class="drop"><b>② AFTER 이미지</b><span style="font-size:13px;color:#8993a6">비교할 수정 후 이미지</span><br><button class="btn pick" data-id="B">이미지 선택</button><div id="nameB" class="name">선택된 파일 없음</div></div></div><input id="fileA" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="fileB" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="privacy">🔒 두 이미지는 별도 서버에 업로드하지 않습니다. 비교 작업은 현재 브라우저에서 처리됩니다.</div><div id="workspace" class="workspace"><div class="toolbar"><button class="mode active" data-mode="wipe">↔ 슬라이더 비교</button><button class="mode" data-mode="overlay">겹쳐보기</button><button class="mode" data-mode="diff">차이 강조</button><label id="opacityBox" class="control" style="display:none">AFTER 투명도 <input id="opacity" type="range" min="0" max="100" value="50"><b id="opacityVal">50%</b></label><label id="thresholdBox" class="control" style="display:none">차이 민감도 <input id="threshold" type="range" min="0" max="150" value="25"><b id="thresholdVal">25</b></label></div><div id="stage" class="stage"><canvas id="canvas"></canvas><div id="sliderLine" class="sliderLine"></div></div><input id="wipeRange" class="rangeSlider" type="range" min="0" max="100" value="50"><div class="stats"><div class="stat"><b id="sizeA">-</b><span>BEFORE</span></div><div class="stat"><b id="sizeB">-</b><span>AFTER</span></div><div class="stat"><b id="diffPct">-</b><span>차이 픽셀 비율</span></div></div><div id="hint" class="hint">슬라이더를 움직여 BEFORE와 AFTER를 비교하세요.</div></div><div id="error" class="error"></div></section></main><script>const fileA=document.getElementById('fileA'),fileB=document.getElementById('fileB'),dropA=document.getElementById('dropA'),dropB=document.getElementById('dropB'),nameA=document.getElementById('nameA'),nameB=document.getElementById('nameB'),workspace=document.getElementById('workspace'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),stage=document.getElementById('stage'),sliderLine=document.getElementById('sliderLine'),wipeRange=document.getElementById('wipeRange'),opacity=document.getElementById('opacity'),opacityVal=document.getElementById('opacityVal'),opacityBox=document.getElementById('opacityBox'),threshold=document.getElementById('threshold'),thresholdVal=document.getElementById('thresholdVal'),thresholdBox=document.getElementById('thresholdBox'),diffPct=document.getElementById('diffPct'),sizeA=document.getElementById('sizeA'),sizeB=document.getElementById('sizeB'),hint=document.getElementById('hint'),errorBox=document.getElementById('error');let A=null,B=null,mode='wipe',diffCache=null;document.querySelectorAll('.pick').forEach(b=>b.onclick=e=>{e.stopPropagation();(b.dataset.id==='A'?fileA:fileB).click()});dropA.onclick=()=>fileA.click();dropB.onclick=()=>fileB.click();fileA.onchange=()=>{if(fileA.files[0])load(fileA.files[0],'A');fileA.value=''};fileB.onchange=()=>{if(fileB.files[0])load(fileB.files[0],'B');fileB.value=''};setupDrop(dropA,'A');setupDrop(dropB,'B');function setupDrop(el,side){el.ondragover=e=>{e.preventDefault();el.classList.add('drag')};el.ondragleave=()=>el.classList.remove('drag');el.ondrop=e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0],side)}}async function load(f,side){hideError();if(!['image/jpeg','image/png','image/webp'].includes(f.type)){showError('JPG, PNG, WebP 이미지를 선택해 주세요.');return}try{const b=await createImageBitmap(f),obj={bmp:b,name:f.name,w:b.width,h:b.height};if(side==='A'){A?.bmp.close?.();A=obj;nameA.textContent=f.name;sizeA.textContent=b.width+' × '+b.height}else{B?.bmp.close?.();B=obj;nameB.textContent=f.name;sizeB.textContent=b.width+' × '+b.height}diffCache=null;if(A&&B){workspace.style.display='block';prepare();render()}}catch(e){showError('이미지를 불러오지 못했습니다.')}}function prepare(){canvas.width=Math.max(A.w,B.w);canvas.height=Math.max(A.h,B.h);if(A.w!==B.w||A.h!==B.h)showError('두 이미지의 크기가 다릅니다. 비교 화면에서는 같은 캔버스에 맞춰 배치합니다. 정확한 픽셀 차이 비교는 같은 크기의 이미지를 권장합니다.');else hideError();calculateDiff()}function drawCentered(im){const x=(canvas.width-im.w)/2,y=(canvas.height-im.h)/2;ctx.drawImage(im.bmp,x,y)}function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);sliderLine.style.display='none';wipeRange.style.display=mode==='wipe'?'block':'none';opacityBox.style.display=mode==='overlay'?'flex':'none';thresholdBox.style.display=mode==='diff'?'flex':'none';if(mode==='wipe'){drawCentered(A);const p=+wipeRange.value/100,cut=canvas.width*p;ctx.save();ctx.beginPath();ctx.rect(cut,0,canvas.width-cut,canvas.height);ctx.clip();drawCentered(B);ctx.restore();sliderLine.style.display='block';sliderLine.style.left=(p*100)+'%';hint.textContent='왼쪽은 BEFORE, 오른쪽은 AFTER입니다. 슬라이더를 움직여 비교하세요.'}else if(mode==='overlay'){drawCentered(A);ctx.save();ctx.globalAlpha=+opacity.value/100;drawCentered(B);ctx.restore();hint.textContent='AFTER 이미지의 투명도를 조절해 두 이미지를 겹쳐 비교하세요.'}else{renderDiff();hint.textContent='차이가 큰 픽셀을 강조합니다. 민감도를 높이면 작은 차이는 제외됩니다.'}}function calculateDiff(){if(!A||!B)return;const w=canvas.width,h=canvas.height,c1=document.createElement('canvas'),c2=document.createElement('canvas');c1.width=c2.width=w;c1.height=c2.height=h;const x1=c1.getContext('2d',{willReadFrequently:true}),x2=c2.getContext('2d',{willReadFrequently:true});x1.fillStyle=x2.fillStyle='#fff';x1.fillRect(0,0,w,h);x2.fillRect(0,0,w,h);x1.drawImage(A.bmp,(w-A.w)/2,(h-A.h)/2);x2.drawImage(B.bmp,(w-B.w)/2,(h-B.h)/2);diffCache={a:x1.getImageData(0,0,w,h),b:x2.getImageData(0,0,w,h)};updateDiffPct()}function updateDiffPct(){if(!diffCache)return;const a=diffCache.a.data,b=diffCache.b.data,t=+threshold.value;let changed=0,total=a.length/4;for(let i=0;i<a.length;i+=4){const d=(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]))/3;if(d>t)changed++}diffPct.textContent=(changed/total*100).toFixed(2)+'%'}function renderDiff(){if(!diffCache)return;const a=diffCache.a,b=diffCache.b,out=new ImageData(new Uint8ClampedArray(a.data),a.width,a.height),od=out.data,bd=b.data,t=+threshold.value;for(let i=0;i<od.length;i+=4){const d=(Math.abs(od[i]-bd[i])+Math.abs(od[i+1]-bd[i+1])+Math.abs(od[i+2]-bd[i+2]))/3;if(d>t){od[i]=255;od[i+1]=55;od[i+2]=55;od[i+3]=255}else{const g=Math.round((od[i]+od[i+1]+od[i+2])/3);od[i]=od[i+1]=od[i+2]=Math.min(245,Math.round(g*.35+190));od[i+3]=255}}ctx.putImageData(out,0,0);updateDiffPct()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});wipeRange.oninput=render;opacity.oninput=()=>{opacityVal.textContent=opacity.value+'%';render()};threshold.oninput=()=>{thresholdVal.textContent=threshold.value;render()};stage.addEventListener('pointerdown',e=>{if(mode!=='wipe')return;stage.setPointerCapture?.(e.pointerId);setWipe(e)});stage.addEventListener('pointermove',e=>{if(mode==='wipe'&&e.buttons)setWipe(e)});function setWipe(e){const r=stage.getBoundingClientRect(),v=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));wipeRange.value=v;render()}function showError(t){errorBox.textContent=t;errorBox.style.display='block'}function hideError(){errorBox.style.display='none'}</script></body></html>
